name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ha-parcel-integrations/.github/.github/workflows/carrier-validate.yml@main
    with:
      domain: parcel_aggregator
      # tests/test_llm.py importorskips homeassistant.components.llm, which no
      # longer exists in current HA, so llm.py is uncovered until that test is
      # ported to homeassistant.helpers.llm. Raise this back to 95 after.
      coverage-threshold: 94
