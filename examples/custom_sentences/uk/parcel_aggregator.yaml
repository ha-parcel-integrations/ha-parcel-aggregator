# Copy this file to config/custom_sentences/uk/parcel_aggregator.yaml, then
# restart Home Assistant (or Developer Tools -> YAML -> reload "Custom
# sentences"). This teaches the built-in (non-LLM) Assist agent to answer
# "what is it" style follow-ups with the full parcel breakdown, not just the
# bucket sensor's bare count.
#
# Machine-translated starting point, not reviewed by a native speaker — feel
# free to correct phrasing or add your own. See ../../../README.md#assist--voice-support
# for background.
language: "uk"
intents:
  ParcelAggregatorGetDetails:
    data:
      - sentences:
            - "які посилки я отримаю (сьогодні|)"
            - "що доставляється (сьогодні|)"
        slots:
          bucket: "incoming"
      - sentences:
            - "які посилки доставлено"
            - "що я отримав (сьогодні|)"
        slots:
          bucket: "delivered"
      - sentences:
            - "які посилки очікують отримання"
            - "що очікує у пункті видачі"
        slots:
          bucket: "awaiting_pickup"
