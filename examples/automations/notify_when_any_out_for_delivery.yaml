# Notify exactly once per parcel when any carrier says it's on the
# delivery vehicle today. Filters on the canonical ParcelStatus value
# `out_for_delivery`, so this is independent of carrier-specific raw
# status strings.
#
# Want a different emoji or colour per carrier? Uncomment the lines marked
# "per-carrier" and list only the carriers you have installed. Any carrier
# that is not in the list falls back to `default_style`.

alias: "Parcel: out for delivery (any carrier)"
description: Notify when any parcel goes out for delivery today.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: parcel_aggregator_parcel_status_changed
    event_data:
      new_status: out_for_delivery

# per-carrier: styling
# variables:
#   carrier_styles:
#     DHL: { emoji: "🟡", color: "yellow" }
#     DPD: { emoji: "🔴", color: "red" }
#     PostNL: { emoji: "🟠", color: "orange" }
#   default_style: { emoji: "📦", color: "#888888" }
#   style: "{{ carrier_styles.get(trigger.event.data.carrier, default_style) }}"

actions:
  - action: notify.mobile_app
    data:
      title: "Out for delivery today ({{ trigger.event.data.carrier }})"
      # per-carrier: replace the title above with
      # title: "{{ style.emoji }} {{ trigger.event.data.carrier }} on the way"
      message: >-
        {{ trigger.event.data.sender }} – {{ trigger.event.data.barcode }}
      data:
        # per-carrier: add
        # color: "{{ style.color }}"
        clickAction: "{{ trigger.event.data.url }}"
